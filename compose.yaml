services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finops_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      retries: 10
volumes:
  finops_data:
